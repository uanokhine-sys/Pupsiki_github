<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <section class="left-block">
                <header class="logo">
                    <img src="img/disney-logo.svg" width="100" alt="Disney+">
                </header>
                
                <section class="left-block-content">
                    <div class="top-img">
                        <img src="img/dolby-digital.svg" width="24" alt="Dolby">
                        <img src="img/4k-video.svg" width="24" alt="4K">
                    </div>

                    <div class="luca-logo">
                        <img src="img/luca-logo.svg" width="240" alt="Luca">
                    </div>

                    <article class="raiting-holder">
                        <a href="#" class="btn">
                            <img src="img/play.svg" alt="Play">
                        </a>

                        <div class="raiting-block">
                            <span class="raiting-block__text">IMDb RATING</span>
                            <div class="raiting-value">
                                <img src="img/star.svg" width="24" alt="Star">
                                <span>7.4/10</span>
                            </div>
                        </div>
                    </article>

                    <p class="left-text">
                        Пупусики/
                    </p>
                </section>
            </section>

            <section class="right-block">
                2
            </section>
        </div>
    </main>
</body>
</html>
